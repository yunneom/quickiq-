name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run doubles as a production health probe (see prod-health).
  workflow_dispatch:

jobs:
  # Reads PUBLIC production URLs only (media manifests + the cron's
  # status snapshot) and prints them to the job log, so pipeline issues
  # can be diagnosed without Vercel/Supabase dashboard access. Runs on
  # every event (~10s) — a PR push is the cheapest way to take a fresh
  # reading, since this repo's integration cannot dispatch or re-run.
  prod-health:
    name: Production media health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public status + manifests
        run: |
          BASE="https://wprgqtzmddtwepmeukgn.supabase.co/storage/v1/object/public/ig-media"
          for p in "status/last-run.json" \
                   "status/last-manual-clip-import.json" \
                   "footage/clips/manifest.json" \
                   "audio/manifest.json" \
                   "footage/manifest.json"; do
            echo "===== $p ====="
            curl -sS --max-time 20 "$BASE/$p" || echo "(unreachable)"
            echo ""
          done

  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Cheap (~1s) — runs before build so a broken pure-function
        # implementation fails fast without waiting for Next compilation.
        run: npm run test:unit

      - name: Build
        # CI build runs without secrets — the app must compile cleanly in
        # dev-mode (no Supabase / Lemon Squeezy / Resend keys). All external
        # services are guarded by isXxxConfigured() checks.
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
